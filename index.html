<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 3 - CSS Exercises</title>
    <link rel="stylesheet" href="../CSS/style.css" />
  </head>
  <body>
    <nav>
      <div class="brand">BrandName</div>
      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </div>
    </nav>

    <div class="layout">
      <aside class="sidebar">
        <h3>Sidebar Content</h3>
        <p>Meniu lateral sau informații suplimentare.</p>
      </aside>

      <main class="main-content">
        <section>
          <h2>Step 1: CSS Selectors</h2>
          <p class="important">An important paragraph</p>
        </section>

        <section>
          <h2>Step 2: Box Model</h2>
          <div class="card-a">Card A (content-box)</div>
          <div class="card-b">Card B (border-box)</div>
        </section>

        <section>
          <h2>Step 4: CSS Grid Gallery</h2>
          <div class="gallery">
            <div class="card">Card 1</div>
            <div class="card">Card 2</div>
            <div class="card">Card 3</div>
            <div class="card">Card 4</div>
            <div class="card">Card 5</div>
            <div class="card">Card 6</div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
